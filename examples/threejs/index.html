<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Three.js compatibility smoke test for the Low-Poly Cyberpunk Buildings Pack"
    />
    <title>Cyberpunk Buildings — Three.js Smoke Test</title>
  </head>
  <body>
    <main id="app">
      <canvas id="scene" aria-label="Interactive Three.js view of three cyberpunk buildings"></canvas>

      <header class="masthead">
        <p class="eyebrow">Three.js compatibility test</p>
        <h1>Low-Poly Cyberpunk Buildings</h1>
        <p class="subtitle">Native GLB scale, PBR textures, normal maps, and emissive materials.</p>
      </header>

      <aside class="status-panel" aria-live="polite">
        <div class="status-row">
          <span id="status-dot" class="status-dot loading"></span>
          <span id="status">Loading three representative GLBs…</span>
        </div>
        <div id="asset-list" class="asset-list"></div>
      </aside>

      <div class="controls-hint">Drag to orbit · Scroll to zoom · Right-drag to pan</div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
